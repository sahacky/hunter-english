<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F8F4" />
    <meta name="description" content="Hunter English — английский с нуля до C1" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="apple-touch-icon" href="icons/maskable-512.png" />
    <script>
      // Анти-FOUC темы: зеркало выбора (he-theme) пишется SettingsProvider;
      // до загрузки бандла ставим сохранённую тему, иначе светлую Daylight (дефолт)
      try {
        var saved = localStorage.getItem('he-theme')
        document.documentElement.dataset.theme = saved || 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>Hunter English</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
